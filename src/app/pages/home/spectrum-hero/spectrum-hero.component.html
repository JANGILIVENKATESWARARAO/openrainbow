<section class="hero" (mouseleave)="paused.set(false)">
  <div class="container hero__grid">
    <div class="hero__copy">
      <p class="eyebrow">UK IT services &amp; solutions</p>
      <h1 class="hero__title">Your whole IT life cycle. <span>One team.</span></h1>
      <p class="hero__lead">Start a project with us, or bring us in at any stage.</p>

      <div class="hero__stage" aria-live="polite">
        @for (stage of [active()]; track stage.id) {
          <div class="stage" [style.--c]="stage.color">
            <span class="stage__no">{{ stage.no }}</span>
            <div>
              <strong class="stage__name">{{ stage.name }}</strong>
              <p class="stage__line">{{ stage.line }}</p>
            </div>
          </div>
        }
      </div>

      <div class="hero__actions">
        <a routerLink="/contact" class="btn btn--spectrum">Talk to us</a>
        <a routerLink="/services" class="btn btn--ghost">See services</a>
      </div>
    </div>

    <div class="hero__art">
      <svg viewBox="0 0 700 520" role="group" aria-label="The IT life cycle, from design to improve">
        <defs>
          <linearGradient id="beam" x1="0" x2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0" />
            <stop offset="1" stop-color="#fff" stop-opacity="0.95" />
          </linearGradient>
        </defs>

        <!-- Incoming white light -->
        <path class="beam" d="M 0 282 L 168 270" stroke="url(#beam)" />
        <path class="beam-pulse" d="M 0 282 L 168 270" pathLength="100" />

        <!-- Fibres, one per stage -->
        @for (f of fibres; track f.no; let i = $index) {
          <g
            class="fibre"
            [class.is-active]="i === index()"
            [style.color]="f.color"
            tabindex="0"
            role="button"
            [attr.aria-label]="f.no + ' ' + f.name + ': ' + f.line"
            [attr.aria-pressed]="i === index()"
            (click)="select(i)"
            (keydown.enter)="select(i)"
            (keydown.space)="$event.preventDefault(); select(i)"
          >
            <path class="fibre__hit" [attr.d]="f.d" />
            <path class="fibre__core" [attr.d]="f.d" stroke="currentColor" />
            <path
              class="fibre__pulse"
              [attr.d]="f.d"
              stroke="currentColor"
              pathLength="100"
              [style.animation-delay]="i * 0.32 + 's'"
            />
            <circle class="fibre__end" cx="540" [attr.cy]="f.labelY - 7" r="5" fill="currentColor" />
            <text class="fibre__no" x="556" [attr.y]="f.labelY" fill="currentColor">{{ f.no }}</text>
            <text class="fibre__name" x="584" [attr.y]="f.labelY">{{ f.name }}</text>
          </g>
        }

        <!-- Prism -->
        <polygon class="prism" points="200,176 276,328 124,328" />
      </svg>
    </div>
  </div>
</section>
