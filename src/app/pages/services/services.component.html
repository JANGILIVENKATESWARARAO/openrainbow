<or-page-hero
  crumb="Services"
  title="A complete life cycle of IT services."
  lead="Whether you need a business case, a new network design, or your systems managed and maintained, we can start a project with you or join at any stage."
/>

@if (data(); as d) {
  <section class="section">
    <div class="container">
      <or-practices [practices]="d.practices" [detailed]="true" />
    </div>
  </section>

  <section class="section section--paper">
    <div class="container">
      <div class="section-head">
        <div>
          <p class="eyebrow">Specialist services</p>
          <h2>Focused services for specific needs.</h2>
        </div>
        <p>Delivered on their own or as part of a wider project.</p>
      </div>
      <ul class="spec">
        @for (s of d.items; track s.slug) {
          <li>
            <a [routerLink]="['/services', s.slug]">
              <span class="icon-tile"><or-icon [name]="s.icon" /></span>
              <h3>{{ s.title }}</h3>
              <p>{{ s.summary }}</p>
              <span class="arrow-link">Learn more <span aria-hidden="true">&rarr;</span></span>
            </a>
          </li>
        }
      </ul>
    </div>
  </section>
}

<or-cta-band />
