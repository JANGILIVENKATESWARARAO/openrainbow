@let page = copy();

<or-page-hero [crumb]="page.crumb" [heading]="page" />

@if (data(); as d) {
  <section class="section">
    <div class="container">
      <or-practices [practices]="d.practices" [detailed]="true" />
    </div>
  </section>

  <section class="section section--paper">
    <div class="container">
      <or-section-head [heading]="page.specialist" />
      <ul class="spec">
        @for (s of d.items; track s.slug; let i = $index) {
          <li class="card-soft" orReveal [revealDelay]="(i % 3) * 90">
            <a [routerLink]="['/services', s.slug]">
              <span class="icon-tile"><or-icon [name]="s.icon" /></span>
              <h3>{{ s.title }}</h3>
              <p>{{ s.summary }}</p>
              <span class="arrow-link">{{ page.more }} <span aria-hidden="true">&rarr;</span></span>
            </a>
          </li>
        }
      </ul>
    </div>
  </section>
}

<or-cta-band />
