<header class="header" [class.is-open]="menuOpen()" [class.is-scrolled]="scrolled()">
  <div class="container header__bar">
    <a routerLink="/" class="header__brand" aria-label="Home">
      <or-logo />
    </a>

    <button
      type="button"
      class="header__toggle"
      aria-controls="main-nav"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      (click)="toggle()"
    >
      <or-icon [name]="menuOpen() ? 'close' : 'menu'" />
    </button>

    <nav id="main-nav" class="header__nav" aria-label="Main">
      <ul class="header__links">
        @for (link of links(); track link.path) {
          <li [class.has-menu]="link.items.length > 0">
            <a class="top" [routerLink]="link.path" routerLinkActive="is-active" (click)="blur($event)">
              {{ link.label }}
              @if (link.items.length) {
                <or-icon class="top__chevron" name="chevron" />
              }
            </a>

            @if (link.items.length) {
              <div class="drop">
                <ul>
                  @for (item of link.items; track item.slug) {
                    <li>
                      <a [routerLink]="[link.path, item.slug]" routerLinkActive="is-current" (click)="blur($event)">{{ item.title }}</a>
                    </li>
                  }
                </ul>
                <a class="drop__all" [routerLink]="link.path" (click)="blur($event)">
                  {{ header().viewAll }} {{ link.label.toLowerCase() }} <or-icon name="arrow" />
                </a>
              </div>
            }
          </li>
        }
      </ul>
      <div class="header__actions">
        <or-theme-toggle />
        <a [routerLink]="header().cta.path" class="btn btn--primary header__cta">{{ header().cta.label }}</a>
      </div>
    </nav>
  </div>
</header>
