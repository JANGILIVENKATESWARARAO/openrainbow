<header class="header" [class.is-open]="menuOpen()" [class.is-scrolled]="scrolled()">
  <div class="container header__bar">
    <a routerLink="/" class="header__brand" aria-label="OpenRainbow IT home" (click)="close()">
      <or-logo />
    </a>

    <button
      type="button"
      class="header__toggle"
      aria-controls="main-nav"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggle()"
    >
      <span class="sr-only">{{ menuOpen() ? 'Close menu' : 'Open menu' }}</span>
      <span class="burger" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>

    <nav id="main-nav" class="header__nav" aria-label="Main">
      <ul class="header__links">
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: link.exact }"
              (click)="close()"
              >{{ link.label }}</a
            >
          </li>
        }
      </ul>
      <a class="header__phone" [href]="contact.phoneHref">{{ contact.phone }}</a>
      <a routerLink="/contact" class="btn btn--spectrum header__cta" (click)="close()">Get in touch</a>
    </nav>
  </div>
</header>
