<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <title>Open Rainbow | IT services &amp; solutions</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Open Rainbow: hardware, software and IT services for UK organisations. Design, deploy, operate and improve, since 2014." />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light dark" />
  <!-- Apply the saved or system theme before the first paint (no flash). ThemeService takes over after start-up. -->
  <script>
    (function () {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('or-theme');
        theme = saved === 'dark' || saved === 'light' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <or-root></or-root>
</body>
</html>
