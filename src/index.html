<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <title>Open Rainbow | IT services &amp; solutions</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Open Rainbow: hardware, software and IT services for UK organisations. Design, deploy, operate and improve, since 2014." />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light dark" />
  <!-- Apply the saved or system theme before the first paint (no flash). ThemeService takes over after start-up. -->
  <script>
    (function () {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('or-theme');
        theme = saved === 'dark' || saved === 'light' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="images/logo-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Start-up loader (styles: .or-loader in styles.scss). AppComponent fades it out after the first render; skipped for 404 pages. -->
  <div id="or-boot" class="or-loader" role="status">
    <div class="or-loader__orbit">
      <span class="or-loader__arc"></span>
      <span class="or-loader__arc or-loader__arc--inner"></span>
      <img class="or-loader__mark" src="images/logo-mark.svg" alt="" width="56" height="56" />
    </div>
    <span class="sr-only">Loading</span>
  </div>
  <script>
    // Unknown addresses (the 404 page) open without the start-up loader.
    // Keep this list in step with the top-level paths in src/app/app.routes.ts.
    (function () {
      var known = ['', 'services', 'solutions', 'blog', 'about', 'contact', 'insights'];
      var first = location.pathname.split('/')[1] || '';
      if (known.indexOf(first) < 0) document.getElementById('or-boot')?.remove();
    })();
  </script>
  <or-root></or-root>
</body>
</html>
